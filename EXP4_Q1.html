<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS3 Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ddd;
        }

        /* Main container */
        .container {
            width: 90%;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Header - Multiple Backgrounds */
        header {
            height: 180px;

            background-image:
                url("https://images.stockcake.com/public/4/0/3/4035579d-5ff2-427f-95df-a2956753e51d_large/ethereal-purple-flower-stockcake.jpg"),
                linear-gradient(to right, #1764b0, #4b8ed8);

            background-position:
                left bottom,
                center;

            background-repeat:
                no-repeat,
                no-repeat;

            background-size:
                120px 100px,
                cover;

            padding: 30px;
            color: white;
        }

        header h1 {
            text-align: center;
            text-shadow: 2px 2px 5px black;
        }

        /* Navigation */
        nav {
            display: flex;
            background: #888;
        }

        nav a {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: black;
        }

        nav a:hover {
            background: red;
            color: white;
        }

        /* Content */
        .content {
            min-height: 350px;
            padding: 20px;
            background:
                linear-gradient(rgba(255,255,255,0.7),
                rgba(255,255,255,0.7)),
                url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT42FSPwa5kUEeDMsRs2MSTCT18uW4plydSfGCd7rvJPmCt_HH4z6O974s&s=10");

            background-size: cover;
            background-position: center;
        }

        /* Rounded box */
        .product-box {
            width: 300px;
            margin: auto;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 5px 5px 15px gray;
        }

        .product-box h3 {
            text-align: center;
            background: green;
            color: white;
            padding: 10px;
            margin: 0;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #999;
            text-align: center;
        }

        /* Odd and even rows */
        tr:nth-child(odd) {
            background-color: #d9ff66;
        }

        tr:nth-child(even) {
            background-color: #00a000;
            color: white;
        }

        tr:hover {
            background-color: orange;
            color: black;
        }

        /* Image hover effect */
        .itemName + .itemImg {
            opacity: 0.2;
            transition: 0.3s;
        }

        .itemName:hover + .itemImg {
            opacity: 1;
        }

        .itemImg img {
            width: 50px;
            height: 50px;
        }

        /* Forms */
        .forms {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .form-box {
            width: 280px;
            padding: 20px;
            background: white;

            border-radius: 15px;

            /* Shadow */
            box-shadow: 5px 5px 15px #555;
        }

        .form-box h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 2px solid #ccc;
        }

        /* Pseudo classes */
        input:focus {
            border: 3px solid red;
            background-color: lightgreen;
        }

        input:required {
            border: 2px solid blue;
        }

        input[type="email"]:invalid {
            color: red;
        }

        input[type="email"]:valid {
            color: blue;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #087bea;
            color: white;
        }

        button:hover {
            background: darkblue;
        }

        /* Footer */
        footer {
            padding: 20px;
            background: #ffe5bd;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <header>
        <h1>Advanced CSS3 Webpage</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Myself</a>
        <a href="#">Others</a>
    </nav>

    <!-- Content -->
    <section class="content">

        <div class="product-box">

            <h3>Products</h3>

            <table>

                <tr>
                    <td class="itemName">Apple</td>
                    <td class="itemImg">
                        <img src="https://i0.wp.com/vegip.in/wp-content/uploads/2025/07/Apple-R.-1000x1000-png.jpg?fit=360%2C360&ssl=1">
                    </td>
                </tr>

                <tr>
                    <td class="itemName">Orange</td>
                    <td class="itemImg">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTclSj5oNBIWwSkt7XxWF4n5kfrecp8IEAhrgcjB9IEv_Wgf_KnLUCWGgLA&s=10">
                    </td>
                </tr>

                <tr>
                    <td class="itemName">Mango</td>
                    <td class="itemImg">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGG2y9iJ4p3HReeYCzkP8cIrQoZ9x-C-d9pXqKowFqdg&s=10">
                    </td>
                </tr>

                <tr>
                    <td class="itemName">Banana</td>
                    <td class="itemImg">
                        <img src="https://media.istockphoto.com/id/2197760431/photo/half-peeled-banana-isolated-on-black-background.jpg?s=612x612&w=0&k=20&c=CxMtulpl0li3CR8fCtNV2D__SV9eMcUd5PLp1zFd4GM=">
                    </td>
                </tr>

            </table>

        </div>


        <!-- Sign In and Sign Up -->
        <div class="forms">

            <div class="form-box">

                <h2>Sign In</h2>

                <input
                    type="text"
                    placeholder="Username"
                    required>

                <input
                    type="password"
                    placeholder="Password"
                    required>

                <button>Sign In</button>

            </div>


            <div class="form-box">

                <h2>Sign Up</h2>

                <input
                    type="text"
                    placeholder="Name"
                    required>

                <input
                    type="email"
                    placeholder="Email"
                    required>

                <input
                    type="password"
                    placeholder="Password"
                    required>

                <button>Sign Up</button>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        URK24CS1153 - Dhivya Shree M<br>
        © 2026 - Web Technology Lab. All Rights Reserved.
    </footer>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
</head>

<body>

    <h2>Currency Converter</h2>

    <fieldset>

        Convert
        <input type="text" id="data">

        <select id="from">
            <option value="rupee">Indian Rupee</option>
            <option value="dollar">US Dollar</option>
        </select>

        to

        <select id="to">
            <option value="dollar">US Dollar</option>
            <option value="rupee">Indian Rupee</option>
        </select>

        <br><br>

        <button onclick="convert()">Calculate</button>

        <span id="answer"></span>

    </fieldset>

    <script>
        function convert() {

            var value =
                parseFloat(document.getElementById("data").value);

            var from =
                document.getElementById("from").value;

            var to =
                document.getElementById("to").value;

            var result;

            if (from == "rupee" && to == "dollar") {

                result = value * 0.015;

                document.getElementById("answer").innerHTML =
                    result.toFixed(2) + " USD";
            }

            else if (from == "dollar" && to == "rupee") {

                result = value * 67.12;

                document.getElementById("answer").innerHTML =
                    result.toFixed(2) + " INR";
            }

            else {

                result = value;

                document.getElementById("answer").innerHTML =
                    result.toFixed(2);
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Birthday Cake Order</title>
</head>

<body>

    <h1>Cake Order Form</h1>

    <fieldset>

        <label>
            No. of 1/2kg Cakes:
        </label>

        <input type="text" id="small">
        <br><br>

        <label>
            No. of 1kg Cakes:
        </label>

        <input type="text" id="medium">
        <br><br>

        <label>
            No.of 2kg Cakes:
        </label>

        <input type="text" id="large">
        <br><br>

        <label>Tip:</label>

        <input type="radio"
               value="10"
               name="tip"
               checked>
        10%

        <input type="radio"
               value="15"
               name="tip">
        15%

        <input type="radio"
               value="20"
               name="tip">
        20%

        <br><br>

        <button id="submit">
            Calculate Order
        </button>

    </fieldset>

    <p>
        Cost of order:
        ₹<span id="price"></span>
    </p>

    <script>

        document.getElementById("submit")
            .addEventListener("click", calculateOrder);

        function calculateOrder() {

            // Get number of cakes
            var small =
                parseInt(document.getElementById("small").value) || 0;

            var medium =
                parseInt(document.getElementById("medium").value) || 0;

            var large =
                parseInt(document.getElementById("large").value) || 0;

            // Get selected tax
            var tip =
                parseInt(
                    document.querySelector(
                        'input[name="tip"]:checked'
                    ).value
                );

            // Cake prices
            var smallPrice = 100;
            var mediumPrice = 200;
            var largePrice = 400;

            // Calculate subtotal
            var subtotal =
                (small * smallPrice) +
                (medium * mediumPrice) +
                (large * largePrice);

            // Calculate tax
            var tax = subtotal * (tip / 100);

            // Final cost
            var total = subtotal + tax;

            // Display result
            document.getElementById("price").innerHTML =
                total.toFixed(2);
        }

    </script>

</body>
</html>
